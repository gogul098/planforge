name: Website -> Azure Static Web Apps (Free plan)

on:
  push:
    branches: [main]
    paths: ["app/static/**", ".github/workflows/azure-static-web-app.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the code
        run: node --check app/static/app.js
      - name: Guard - no model weights in the site
        run: |
          if find app/static -type f \( -name '*.pt' -o -name '*.pth' -o -name '*.onnx' -o -name '*.safetensors' -o -name '*.bin' \) | grep -q .; then
            echo "Model files must not be in the site (they load from Hugging Face)"; exit 1; fi
      - name: Point the site at the conversion engine
        if: ${{ vars.PLANFORGE_API != '' }}
        run: echo "window.PLANFORGE_API = \"${{ vars.PLANFORGE_API }}\";" > app/static/config.js
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: app/static
          skip_app_build: true
