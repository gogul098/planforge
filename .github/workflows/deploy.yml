name: Deploy to Google Cloud Run

on:
  push:
    branches: [main]
    paths: ["app/**", "Dockerfile", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  REGION: asia-south1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the code
        run: |
          python -m py_compile app/server.py app/pipeline.py
          node --check app/static/app.js
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push the image
        run: |
          IMAGE=$REGION-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/planforge/app:${{ github.sha }}
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          gcloud auth configure-docker $REGION-docker.pkg.dev -q
          docker build -t $IMAGE .
          docker push $IMAGE
      - name: Deploy
        run: |
          # 2 CPU / 4 GB, scales to zero, never more than 1 instance (cost cap + one job queue);
          # CPU stays on while an instance is up so background conversions are not throttled
          gcloud run deploy planforge --image $IMAGE --region $REGION \
            --cpu 2 --memory 4Gi --min-instances 0 --max-instances 1 --concurrency 40 \
            --no-cpu-throttling --timeout 900 --port 8080 --allow-unauthenticated \
            --set-secrets HF_TOKEN=hf-token:latest -q
          echo "Live at: $(gcloud run services describe planforge --region $REGION --format='value(status.url)')"
