name: Engine -> Azure Web App

# On every push to main: build the engine image, push it to GitHub's registry, and deploy that exact
# image to the Azure Web App. Deploy uses the Web App's publish profile (secret AZURE_WEBAPP_PUBLISH_PROFILE)
# and the app name (variable AZURE_WEBAPP_NAME). Without them the image is only built.
# Model weights are never in the image: the app loads them from Azure Blob Storage (copied from HF on release).
on:
  push:
    branches: [main]
    paths: ["app/**", "Dockerfile", ".dockerignore", ".github/workflows/azure-engine.yml"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/planforge-engine
  HAS_AZ: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE != '' }}

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Guard - no model weights in the image
        run: |
          if find . -type f \( -name '*.pt' -o -name '*.pth' -o -name '*.onnx' -o -name '*.safetensors' \) -not -path './.git/*' | grep -q .; then
            echo "Model files must not be in the repo"; exit 1; fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILT_AT=${{ github.event.head_commit.timestamp || github.run_started_at }}
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.sha }}
      - name: Deploy to the Web App
        if: env.HAS_AZ == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ env.IMAGE }}:${{ github.sha }}
      - name: Not deployed (publish profile not set yet)
        if: env.HAS_AZ != 'true'
        run: echo "Image built and pushed. Add the AZURE_WEBAPP_PUBLISH_PROFILE secret and AZURE_WEBAPP_NAME variable to deploy automatically."
