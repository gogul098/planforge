name: Engine -> Azure Container Apps

# On every push to main: build the engine image, push it to GitHub's registry, and switch the
# Azure container app to it (a new revision). Login is passwordless: a user-assigned managed identity
# with a federated credential for this repo's main branch (secrets AZURE_CLIENT_ID / AZURE_TENANT_ID /
# AZURE_SUBSCRIPTION_ID - IDs only, nothing secret). Model weights are never in the image.
on:
  push:
    branches: [main]
    paths: ["app/**", "Dockerfile", ".dockerignore", ".github/workflows/azure-engine.yml"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/planforge-engine
  RG: planforge-rg
  APP: planforge
  HAS_AZ: ${{ secrets.AZURE_CLIENT_ID != '' }}

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Guard - no model weights in the image
        run: |
          if find . -type f \( -name '*.pt' -o -name '*.pth' -o -name '*.onnx' -o -name '*.safetensors' \) -not -path './.git/*' | grep -q .; then
            echo "Model files must not be in the repo"; exit 1; fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.sha }}
      - name: Azure login (managed identity, no password)
        if: env.HAS_AZ == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy new revision
        if: env.HAS_AZ == 'true'
        run: |
          az extension add --name containerapp --upgrade -y >/dev/null 2>&1
          az containerapp update -n $APP -g $RG \
            --image $IMAGE:${{ github.sha }} \
            --revision-suffix r${GITHUB_SHA::7} -o none
          echo "Deployed $IMAGE:${{ github.sha }} to https://$(az containerapp show -n $APP -g $RG --query properties.configuration.ingress.fqdn -o tsv)"
      - name: Not deployed (Azure IDs not set yet)
        if: env.HAS_AZ != 'true'
        run: echo "Image built and pushed. Add AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID secrets to deploy automatically."
