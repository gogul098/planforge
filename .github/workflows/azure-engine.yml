name: Engine -> Azure Container Apps (free monthly grant)

# Builds the conversion engine (app/server.py + pipeline) into a container image on GitHub's
# registry and runs it on Azure Container Apps, scaled to zero when idle.
# The model weights are NOT in the image: the engine downloads them from Hugging Face at first use
# (HF_TOKEN is an Azure secret, never in the repo).
on:
  push:
    branches: [main]
    paths: ["app/**", "Dockerfile", ".github/workflows/azure-engine.yml"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/planforge-engine
  RG: planforge-rg                 # separate resource group - nothing else in the subscription is touched
  APP: planforge-engine
  ENV_NAME: planforge-env
  LOCATION: centralindia

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Guard - no model weights in the image
        run: |
          if find . -type f \( -name '*.pt' -o -name '*.pth' -o -name '*.onnx' -o -name '*.safetensors' \) -not -path './.git/*' | grep -q .; then
            echo "Model files must not be in the repo"; exit 1; fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.sha }}
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Create or update the container app
        run: |
          az extension add --name containerapp --upgrade -y >/dev/null
          az provider register -n Microsoft.App --wait
          az provider register -n Microsoft.OperationalInsights --wait
          az group create -n $RG -l $LOCATION -o none
          az containerapp env show -n $ENV_NAME -g $RG -o none 2>/dev/null || \
            az containerapp env create -n $ENV_NAME -g $RG -l $LOCATION -o none
          if az containerapp show -n $APP -g $RG -o none 2>/dev/null; then
            az containerapp update -n $APP -g $RG --image $IMAGE:${{ github.sha }} -o none
          else
            az containerapp create -n $APP -g $RG --environment $ENV_NAME \
              --image $IMAGE:${{ github.sha }} --target-port 8080 --ingress external \
              --cpu 2 --memory 4Gi --min-replicas 0 --max-replicas 1 \
              --secrets hf-token="${{ secrets.HF_TOKEN }}" --env-vars HF_TOKEN=secretref:hf-token -o none
          fi
          echo "Engine URL: https://$(az containerapp show -n $APP -g $RG --query properties.configuration.ingress.fqdn -o tsv)"
